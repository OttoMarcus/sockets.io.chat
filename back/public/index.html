<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Socket.IO chat</title>
    <style>
        body { margin: 0; padding-bottom: 3rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        .form { background: rgba(0, 0, 0, 0.15); padding: 0.25rem; position: fixed;  display: flex; height: 4rem; box-sizing: border-box; backdrop-filter: blur(10px); }
        #admin {bottom: 0; left: 0; right: 0;}
        #user {top: 0; left: 0; right: 0;}
        .input { border: none; padding: 0 1rem; flex-grow: 1; border-radius: 2rem; margin: 0.25rem; font-size: larger; }
        .input:focus { outline: none; }
        .form > button { background: #333; border: none; padding: 0 1rem; margin: 0.25rem; border-radius: 3px; outline: none; color: #fff; }

        .messages { list-style-type: none; margin: 0; padding: 0; }
        .messages > li { padding: 0.5rem 2rem; }
        .messages > li:nth-child(odd) { background: #efefef; }
    </style>
</head>
<body>
<ul class="messages"></ul>
<form class="form" id="admin" action="">
    <label for="inputAdmin">Admin Chat</label>
    <input id="inputAdmin" class="input" autocomplete="off" /><button>Send</button>
</form>

<ul class="messages"></ul>
<form class="form" id="user" action="">
    <label for="inputUser">User Chat</label>
    <input id="inputUser" class="input" autocomplete="off" />
    <button  type="submit">Send</button>
</form>
</body>
<!--<script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>-->
<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io("http://localhost:3000/userChat");
    // const socket = io();

    const form = document.getElementById('user');
    const input = document.getElementById('inputUser')

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (input.value) {
            socket.on("connect", () => {
                console.log("Connected to /userChat namespace:", socket.id);

                socket.emit('User:message', input.value);

            })
            // console.log(input.value);
            // input.value = '';
        }
    });
</script>
</html>
